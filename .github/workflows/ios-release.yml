name: iOS imzalı sürüm

# İmzalı App Store .ipa: App Store Connect API anahtarıyla otomatik imzalama (sertifika ve profil Apple'da
# kendiliğinden oluşturulur). Gerekli gizli değişkenler: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (.p8 içeriği).
# İsteğe bağlı: GOOGLE_SERVICE_INFO_PLIST_B64 (Google/Apple ile giriş). "upload" seçilirse App Store Connect'e
# (TestFlight) yüklenir.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect'e (TestFlight) yükle"
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: G3LKL7QH6D
    steps:
      - uses: actions/checkout@v4

      - name: Gizli değişkenleri denetle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::$v gizli değişkeni yok"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Firebase yapılandırması
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > DrawGuidance/Resources/GoogleService-Info.plist
            SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DrawGuidance/Resources/GoogleService-Info.plist)
            echo "DG_GOOGLE_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          else
            echo "DG_GOOGLE_URL_SCHEME=" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 yok: Google/Apple ile giriş kapalı derlenir"
          fi

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Arşivle (otomatik imzalama)
        run: |
          mkdir -p build
          xcodebuild archive -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/DrawGuidance.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/archive.log 2>&1 \
            || { grep -E "error:|Provisioning|signing" build/archive.log | sort -u | head -100; tail -30 build/archive.log; exit 1; }
          tail -3 build/archive.log

      - name: .ipa dışa aktar
        run: |
          DEST=export
          if [ "${{ inputs.upload }}" = "true" ]; then DEST=upload; fi
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/DrawGuidance.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1 || { grep -E "error" build/export.log | head -50; tail -30 build/export.log; exit 1; }
          tail -3 build/export.log
          ls -la build/export || true

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signed
          path: |
            ios/build/export/*.ipa
            ios/build/archive.log
            ios/build/export.log
          if-no-files-found: warn
