name: iOS mağaza ekran görüntüleri

# Bir kez simülatör derlemesi, sonra her cihaz x dil için ayrı iş (iPhone 1179x2556, iPad 2048x2732).
on:
  push:
    branches: [claude/project-thread-ht59r1]
    paths: ['.github/workflows/ios-shots.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Simülatör için derle
        run: |
          mkdir -p build
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="" > build/sim-build.log 2>&1 \
            || { grep -E "error:" build/sim-build.log | sort -u | head -50; exit 1; }
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry $GITHUB_WORKSPACE/app.zip DrawGuidance.app
      - uses: actions/upload-artifact@v4
        with: { name: app, path: app.zip, retention-days: 2 }

  shots:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        dev: [phone, pad]
        lang: [tr, en, ar, ja, ko, ru, zh]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app }
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X"
      - name: Ekran görüntüleri
        env: { DEV: "${{ matrix.dev }}", L: "${{ matrix.lang }}" }
        run: |
          set -x
          timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          unzip -q app.zip
          pick() { xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if re.search(sys.argv[1],x["name"])]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"] if c else "")' "$1"; }
          if [ $DEV = phone ]; then UDID=$(pick '^iPhone 1[5-6]$'); [ -z "$UDID" ] && UDID=$(pick '^iPhone 1[5-7]( Pro)?$')
          else UDID=$(pick 'iPad Pro 12.9'); [ -z "$UDID" ] && UDID=$(pick 'iPad Pro 13'); fi
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          timeout 600 xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          timeout 300 xcrun simctl install "$UDID" DrawGuidance.app
          mkdir -p out/$DEV/$L
          shot() { NAME=$1; MIN=$2; shift 2
            timeout 30 xcrun simctl terminate "$UDID" com.karapp.drawguidance || true
            timeout 60 xcrun simctl launch "$UDID" com.karapp.drawguidance -AppleLanguages "($L)" -AppleLocale $L -uiTesting "$@" || true
            sleep "$MIN"
            # Yükleniyor ekranı küçük PNG verir (~120 KB): görüntü 200 KB'ı geçip iki çekimde aynı boyda kalana dek bekle
            F=out/$DEV/$L/$NAME.png; PREV=0
            for i in $(seq 1 16); do
              sleep 6
              timeout 60 xcrun simctl io "$UDID" screenshot "$F" >/dev/null 2>&1 || continue
              SZ=$(stat -f %z "$F")
              if [ "$SZ" -gt 200000 ] && [ $(( SZ - PREV )) -lt 3000 ] && [ $(( PREV - SZ )) -lt 3000 ]; then break; fi
              PREV=$SZ
            done
            ls -la "$F" || true; }
          case $L in
            tr) PR="Alıştırma"; SK="Eskiz"; KD="Güneş";;
            en) PR="Practice"; SK="Sketch"; KD="Sun";;
            ar) PR="تمرين"; SK="رسم"; KD="شمس";;
            ja) PR="練習"; SK="スケッチ"; KD="たいよう";;
            ko) PR="연습"; SK="스케치"; KD="해님";;
            ru) PR="Упражнение"; SK="Эскиз"; KD="Солнце";;
            zh) PR="练习"; SK="素描"; KD="太阳";;
          esac
          if [ $DEV = phone ]; then PEER=iPad; else PEER=iPhone; fi
          shot 01-cizgi-roman 4 -dgTemplate comic_story_chase
          shot 02-manga 4 -dgTemplate comic_story_manga
          shot 03-alistirma 6 -dgOpenNew ART -dgName "$PR" -dgPractice 29
          shot 04-formul-bilim 4 -dgTemplate notes_physics
          shot 05-kimya 4 -dgTemplate notes_chemistry
          shot 06-gelismis-cizim 14 -dgOpenNew ART -dgName "$SK" -dgTutorial art_guides -dgSteps 2
          shot 07-cocuk-gorev 10 -dgOpenNew KIDS -dgName "$KD" -dgChallenge
          shot 08-canli-yayin 4 -dgTemplate comic_story_chase -dgLive -dgPeer "$PEER"
          shot 09-yayinci 4 -dgTemplate comic_story_chase
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "shots-${{ matrix.dev }}-${{ matrix.lang }}", path: out }
