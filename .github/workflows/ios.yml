name: iOS

on:
  push:
    branches: [main, "ios/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: xcodebuild -version

      # Google ve Apple ile giriş: Firebase iOS yapılandırması depoda yok; GitHub gizli değişkeni
      # GOOGLE_SERVICE_INFO_PLIST_B64 (GoogleService-Info.plist'in base64 hali) varsa pakete yazılır ve Google'ın
      # geri dönüş adresi (REVERSED_CLIENT_ID) derlemeye verilir. Yoksa giriş düğmeleri kapalı derlenir.
      - name: Firebase yapılandırması
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > DrawGuidance/Resources/GoogleService-Info.plist
            SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DrawGuidance/Resources/GoogleService-Info.plist)
            echo "DG_GOOGLE_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
            echo "Firebase yapılandırması eklendi"
          else
            echo "DG_GOOGLE_URL_SCHEME=" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 yok: Google/Apple ile giriş kapalı derlenir"
          fi

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simülatör seç
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "udid=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$ID"

      - name: Cihaz için Release derleme (imzasız)
        run: |
          mkdir -p build
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/release.log 2>&1 \
            || { grep -E "error:" build/release.log | sort -u | head -300; tail -30 build/release.log; exit 1; }
          tail -5 build/release.log

      - name: .ipa paketle
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DrawGuidance.app
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../DrawGuidance-v49-ios-unsigned.ipa Payload)
          ls -la build/*.ipa
          echo "Sembol kontrolü (ilk 20):"; nm -U "$APP/DrawGuidance" | head -20 || true

      - name: Birim ve arayüz testleri (simülatör)
        if: success()
        continue-on-error: true
        run: |
          mkdir -p build
          xcodebuild test -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" | tee build/test.log | grep -E "Test Case|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            ios/build/*.ipa
            ios/build/test.log
            ios/build/release.log
            ios/build/TestResults.xcresult
          if-no-files-found: warn
