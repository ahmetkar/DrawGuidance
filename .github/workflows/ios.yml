name: iOS

on:
  push:
    branches: [main, "ios/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: xcodebuild -version

      # Google ve Apple ile giriş: Firebase iOS yapılandırması depoda yok; GitHub gizli değişkeni
      # GOOGLE_SERVICE_INFO_PLIST_B64 (GoogleService-Info.plist'in base64 hali) varsa pakete yazılır ve Google'ın
      # geri dönüş adresi (REVERSED_CLIENT_ID) derlemeye verilir. Yoksa giriş düğmeleri kapalı derlenir.
      - name: Firebase yapılandırması
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > DrawGuidance/Resources/GoogleService-Info.plist
            SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DrawGuidance/Resources/GoogleService-Info.plist)
            echo "DG_GOOGLE_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
            echo "Firebase yapılandırması eklendi"
          else
            echo "DG_GOOGLE_URL_SCHEME=" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 yok: Google/Apple ile giriş kapalı derlenir"
          fi

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simülatör seç
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "udid=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$ID"

      - name: Cihaz için Release derleme (imzasız)
        run: |
          mkdir -p build
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/release.log 2>&1 \
            || { grep -E "error:" build/release.log | sort -u | head -300; tail -30 build/release.log; exit 1; }
          tail -5 build/release.log

      - name: .ipa paketle
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DrawGuidance.app
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../DrawGuidance-v50-ios-unsigned.ipa Payload)
          ls -la build/*.ipa
          echo "Sembol kontrolü (ilk 20):"; nm -U "$APP/DrawGuidance" | head -20 || true

      - name: .ipa yükle (testlerden önce)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/*.ipa

      - name: Açılış tanısı (simülatör, ekran görüntüsü ve ana iş parçacığı örneği)
        if: success()
        continue-on-error: true
        run: |
          mkdir -p build/diag
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/diag/sim-build.log 2>&1 || { tail -30 build/diag/sim-build.log; exit 1; }
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/DrawGuidance.app
          xcrun simctl launch --terminate-running-process "$UDID" com.karapp.drawguidance -uiTesting
          for t in 5 20 45; do
            sleep $([ $t = 5 ] && echo 5 || echo 20)
            xcrun simctl io "$UDID" screenshot build/diag/launch-$t.png || true
          done
          PID=$(pgrep -f "DrawGuidance.app/DrawGuidance" | head -1)
          echo "pid=$PID"
          if [ -n "$PID" ]; then sample "$PID" 5 -file build/diag/sample.txt || true; grep -A60 "Thread_.*DispatchQueue_1\|com.apple.main-thread" build/diag/sample.txt | head -120; fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DrawGuidance"' --style compact > build/diag/app.log 2>&1 || true
          tail -40 build/diag/app.log
          xcrun simctl terminate "$UDID" com.karapp.drawguidance || true
          # Düzenleyici: açılışta yeni ART tuvali açılır (yalnız Debug), ekran görüntüsü ve ana iş parçacığı örneği
          xcrun simctl launch --terminate-running-process "$UDID" com.karapp.drawguidance -uiTesting -dgOpenNew ART
          for t in 10 30 60; do
            sleep $([ $t = 10 ] && echo 10 || ([ $t = 30 ] && echo 20 || echo 30))
            xcrun simctl io "$UDID" screenshot build/diag/editor-$t.png || true
          done
          PID=$(pgrep -f "DrawGuidance.app/DrawGuidance" | head -1)
          if [ -n "$PID" ]; then
            ps -o pid,%cpu,rss,etime -p "$PID" | tee build/diag/editor-ps.txt
            sample "$PID" 5 -file build/diag/editor-sample.txt || true
            grep -A80 "com.apple.main-thread" build/diag/editor-sample.txt | head -140
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DrawGuidance"' --style compact > build/diag/editor-app.log 2>&1 || true
          tail -40 build/diag/editor-app.log
          xcrun simctl terminate "$UDID" com.karapp.drawguidance || true

      - name: Birim ve arayüz testleri (simülatör)
        if: success()
        continue-on-error: true
        run: |
          mkdir -p build
          xcodebuild test -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" | tee build/test.log | grep -E "Test Case|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            ios/build/*.ipa
            ios/build/test.log
            ios/build/release.log
            ios/build/diag
            ios/build/TestResults.xcresult
          if-no-files-found: warn
