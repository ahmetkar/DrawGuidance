name: iOS

on:
  push:
    branches: [main, "ios/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      ui_only:
        description: "Yalnız arayüz testleri (Release derleme, .ipa, tanı ve birim testleri atlanır)"
        type: boolean
        default: false
      signed:
        description: "İmzalı App Store .ipa (SIGN_ASC_KEY_ID, SIGN_ASC_ISSUER_ID, SIGN_ASC_KEY_P8 gizli değişkenleri gerekir; testler atlanır)"
        type: boolean
        default: false
      upload:
        description: "İmzalı .ipa'yı App Store Connect'e (TestFlight) yükle"
        type: boolean
        default: false
      quick:
        description: "v53 hızlı denetim: yalnız simülatör derlemesi ve her tuval türünde düzenleyici ekran görüntüleri"
        type: boolean
        default: false
      tests_only:
        description: "v53 yalnız birim ve arayüz testleri (Release derleme, .ipa ve açılış tanısı atlanır)"
        type: boolean
        default: false
      diag_args:
        description: "Hızlı denetimde uygulamaya verilecek ek açılış argümanları (ör. -dgPanel ELEMENTS)"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ !inputs.signed }}
    runs-on: macos-15-intel
    timeout-minutes: 150
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: xcodebuild -version

      # Google ve Apple ile giriş: Firebase iOS yapılandırması depoda yok; GitHub gizli değişkeni
      # GOOGLE_SERVICE_INFO_PLIST_B64 (GoogleService-Info.plist'in base64 hali) varsa pakete yazılır ve Google'ın
      # geri dönüş adresi (REVERSED_CLIENT_ID) derlemeye verilir. Yoksa giriş düğmeleri kapalı derlenir.
      - name: Firebase yapılandırması
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > DrawGuidance/Resources/GoogleService-Info.plist
            SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DrawGuidance/Resources/GoogleService-Info.plist)
            echo "DG_GOOGLE_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
            echo "Firebase yapılandırması eklendi"
          else
            echo "DG_GOOGLE_URL_SCHEME=" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 yok: Google/Apple ile giriş kapalı derlenir"
          fi

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simülatör seç
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "udid=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$ID"

      - name: Cihaz için Release derleme (imzasız)
        if: ${{ !inputs.ui_only && !inputs.quick && !inputs.tests_only }}
        run: |
          mkdir -p build
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/release.log 2>&1 \
            || { grep -E "error:" build/release.log | sort -u | head -300; tail -30 build/release.log; exit 1; }
          tail -5 build/release.log

      - name: .ipa paketle
        if: ${{ !inputs.ui_only && !inputs.quick && !inputs.tests_only }}
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DrawGuidance.app
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../DrawGuidance-ios-unsigned.ipa Payload)
          ls -la build/*.ipa
          echo "Sembol kontrolü (ilk 20):"; nm -U "$APP/DrawGuidance" | head -20 || true

      - name: .ipa yükle (testlerden önce)
        if: ${{ !inputs.ui_only && !inputs.quick && !inputs.tests_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/*.ipa

      - name: Hızlı denetim (simülatör derlemesi ve tuval türlerinin ekran görüntüleri)
        if: ${{ inputs.quick }}
        run: |
          mkdir -p build/diag
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/diag/sim-build.log 2>&1 || { grep -E "error:" build/diag/sim-build.log | sort -u | head -80; tail -30 build/diag/sim-build.log; exit 1; }
          grep -E "warning:.*(never|unused|deprecated)" build/diag/sim-build.log | sort -u | head -20 || true
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/DrawGuidance.app
          for K in ART NOTES COMIC SIMPLE_ART SIMPLE_NOTES KIDS; do
            xcrun simctl launch --terminate-running-process "$UDID" com.karapp.drawguidance -uiTesting -dgOpenNew $K ${{ inputs.diag_args }}
            sleep 22
            xcrun simctl io "$UDID" screenshot build/diag/quick-$K.png || true
            # v55 yavaş makinede açılış gecikirse ikinci görüntü
            sleep 25
            xcrun simctl io "$UDID" screenshot build/diag/quick-$K-2.png || true
            PID=$(pgrep -f "DrawGuidance.app/DrawGuidance" | head -1)
            [ -n "$PID" ] && ps -o pid,%cpu,rss,etime -p "$PID" | tail -1 | sed "s/^/$K /" | tee -a build/diag/quick-ps.txt
            xcrun simctl terminate "$UDID" com.karapp.drawguidance || true
          done
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "DrawGuidance"' --style compact > build/diag/quick-app.log 2>&1 || true
          grep -iE "fault|crash|fatal" build/diag/quick-app.log | head -20 || true

      - name: Açılış tanısı (simülatör, ekran görüntüsü ve ana iş parçacığı örneği)
        if: success() && !inputs.ui_only && !inputs.quick && !inputs.tests_only
        continue-on-error: true
        run: |
          mkdir -p build/diag
          xcodebuild build -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/diag/sim-build.log 2>&1 || { tail -30 build/diag/sim-build.log; exit 1; }
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/DrawGuidance.app
          xcrun simctl launch --terminate-running-process "$UDID" com.karapp.drawguidance -uiTesting
          for t in 5 20 45; do
            sleep $([ $t = 5 ] && echo 5 || echo 20)
            xcrun simctl io "$UDID" screenshot build/diag/launch-$t.png || true
          done
          PID=$(pgrep -f "DrawGuidance.app/DrawGuidance" | head -1)
          echo "pid=$PID"
          if [ -n "$PID" ]; then sample "$PID" 5 -file build/diag/sample.txt || true; grep -A60 "Thread_.*DispatchQueue_1\|com.apple.main-thread" build/diag/sample.txt | head -120; fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DrawGuidance"' --style compact > build/diag/app.log 2>&1 || true
          tail -40 build/diag/app.log
          xcrun simctl terminate "$UDID" com.karapp.drawguidance || true
          # Düzenleyici: açılışta yeni ART tuvali açılır (yalnız Debug), ekran görüntüsü ve ana iş parçacığı örneği
          xcrun simctl launch --terminate-running-process "$UDID" com.karapp.drawguidance -uiTesting -dgOpenNew ART
          for t in 10 30 60; do
            sleep $([ $t = 10 ] && echo 10 || ([ $t = 30 ] && echo 20 || echo 30))
            xcrun simctl io "$UDID" screenshot build/diag/editor-$t.png || true
          done
          PID=$(pgrep -f "DrawGuidance.app/DrawGuidance" | head -1)
          if [ -n "$PID" ]; then
            ps -o pid,%cpu,rss,etime -p "$PID" | tee build/diag/editor-ps.txt
            sample "$PID" 5 -file build/diag/editor-sample.txt || true
            grep -A80 "com.apple.main-thread" build/diag/editor-sample.txt | head -140
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DrawGuidance"' --style compact > build/diag/editor-app.log 2>&1 || true
          tail -40 build/diag/editor-app.log
          xcrun simctl terminate "$UDID" com.karapp.drawguidance || true

      - name: Birim ve arayüz testleri (simülatör)
        if: success() && !inputs.quick
        continue-on-error: true
        run: |
          mkdir -p build
          xcodebuild test -project DrawGuidance.xcodeproj -scheme DrawGuidance \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            ${{ inputs.ui_only && '-only-testing:DrawGuidanceUITests' || '' }} \
            CODE_SIGNING_ALLOWED=NO DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" | tee build/test.log | grep -E "Test Case|error:|\*\* TEST" || true
          # Yapıt yüklenemezse de görülsün: test hatasındaki erişilebilirlik ağacı ve 3B çizim günlüğü
          sed -n '/DGTREE ----/,/DGTREE ----/p' build/test.log | cut -c1-220 | head -1500 || true
          grep "DG3D" build/test.log | head -40 || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            ios/build/*.ipa
            ios/build/test.log
            ios/build/release.log
            ios/build/diag
            ios/build/TestResults.xcresult
          if-no-files-found: warn

  # İmzalı App Store .ipa: App Store Connect API ile sabit dağıtım anahtarına (SIGN_DIST_KEY) ait Apple Distribution
  # sertifikası ve App Store profili alınır/oluşturulur (ios/tools/signing/asc_signing.py), elle imzalanır.
  release:
    if: ${{ inputs.signed }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: G3LKL7QH6D
      BUNDLE_ID: com.karapp.drawguidance
    steps:
      - uses: actions/checkout@v4

      - name: Gizli değişkenler
        env:
          ASC_KEY_ID: ${{ secrets.SIGN_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.SIGN_ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.SIGN_ASC_KEY_P8 }}
          DIST_KEY: ${{ secrets.SIGN_DIST_KEY }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::SIGN_$v gizli değişkeni yok"; exit 1; fi
          done
          if [ -z "$DIST_KEY" ]; then echo "::error::SIGN_DIST_KEY gizli değişkeni yok"; exit 1; fi
          S="$RUNNER_TEMP/sign"; mkdir -p "$S"; chmod 700 "$S"
          printf '%s\n' "$ASC_KEY_P8" > "$S/asc.p8"
          printf '%s\n' "$DIST_KEY" > "$S/dist.pem"
          { echo "SIGN_DIR=$S"; echo "ASC_KEY_PATH=$S/asc.p8"; echo "DIST_KEY_PATH=$S/dist.pem"
            echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; } >> "$GITHUB_ENV"

      - name: Sertifika ve profil (App Store Connect API)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 tools/signing/asc_signing.py "$SIGN_DIR/out"
          cat "$SIGN_DIR/out/profile.env" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(grep PROFILE_UUID "$SIGN_DIR/out/profile.env" | cut -d= -f2)
          cp "$SIGN_DIR/out/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          KC="$RUNNER_TEMP/sign.keychain-db"; KCP=$(openssl rand -hex 16)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$DIST_KEY_PATH" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security import "$SIGN_DIR/out/dist.cer" -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Firebase yapılandırması
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > DrawGuidance/Resources/GoogleService-Info.plist
            SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DrawGuidance/Resources/GoogleService-Info.plist)
            echo "DG_GOOGLE_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          else
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_B64 yok: yayın sürümünde Google/Apple ile giriş kapalı kalır"; exit 1
          fi

      - name: XcodeGen (uygulama hedefi elle imzalı)
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import os
          p = "project.yml"; s = open(p).read()
          t = s.index("targets:\n  DrawGuidance:")
          b = s.index("    settings:\n      base:\n", t) + len("    settings:\n      base:\n")
          add = ("        CODE_SIGN_STYLE: Manual\n"
                 "        CODE_SIGN_IDENTITY: \"Apple Distribution\"\n"
                 f"        PROVISIONING_PROFILE_SPECIFIER: \"{os.environ['PROFILE_NAME']}\"\n")
          open(p, "w").write(s[:b] + add + s[b:])
          PY
          xcodegen generate

      - name: Arşivle
        run: |
          mkdir -p build
          xcodebuild archive -project DrawGuidance.xcodeproj -scheme DrawGuidance -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/DrawGuidance.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            DG_GOOGLE_URL_SCHEME="$DG_GOOGLE_URL_SCHEME" > build/archive.log 2>&1 \
            || { grep -E "error:" build/archive.log | sort -u | head -100; tail -30 build/archive.log; exit 1; }
          tail -3 build/archive.log

      - name: .ipa dışa aktar
        run: |
          DEST=export
          if [ "${{ inputs.upload }}" = "true" ]; then DEST=upload; fi
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/DrawGuidance.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1 || { grep -E "error" build/export.log | head -50; tail -30 build/export.log; exit 1; }
          tail -3 build/export.log
          ls -la build/export || true
          codesign -dv --verbose=2 build/DrawGuidance.xcarchive/Products/Applications/DrawGuidance.app 2>&1 | grep -E "Authority|TeamIdentifier" || true

      - name: Anahtarları sil
        if: always()
        run: |
          rm -rf "$SIGN_DIR"
          [ -n "$SIGN_KEYCHAIN" ] && security delete-keychain "$SIGN_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signed
          path: |
            ios/build/export/*.ipa
            ios/build/archive.log
            ios/build/export.log
          if-no-files-found: warn
