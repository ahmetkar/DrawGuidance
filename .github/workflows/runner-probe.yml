name: Runner probe
on:
  push:
    branches: ["ios/**"]
    paths: [".github/workflows/runner-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a; sw_vers 2>/dev/null || true; xcodebuild -version 2>/dev/null || true
