org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Modüller (app + core:model) paralel derlenir, görev çıktıları önbellekten yeniden kullanılır
org.gradle.parallel=true
org.gradle.caching=true

# v42 R8 tam kipi kapalı (uyumluluk kipi): yansıma ve varsayılan kurucu varsayımları daha güvenli.
# v45 Android 10'daki Ayarlar çökmesini gideren budur; açılmamalı (V45R8ConfigTest denetler).
android.enableR8.fullMode=false
