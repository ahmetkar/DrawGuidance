# DrawGuidance (v33): MongoDB kopya kümesi + Spring Boot API (katalog ve Firebase kimlikli kullanıcı kaydı;
# kullanıcı tuvalleri, klasörleri, resimleri, 3B şekilleri sunucuda tutulmaz).
#   docker compose up -d                      → tek üyeli kopya kümesi (rs0) ve API
#   docker compose --profile rs3 up -d        → üç üyeli kopya kümesi (.env: RS_MEMBERS=mongo1:27017,mongo2:27017,mongo3:27017)
#   docker compose --profile tools up -d      → tarayıcıdan yönetim (mongo-express, http://localhost:8081)
# Parçalı küme için: docker compose -f docker-compose.sharded.yml up -d
name: drawguidance

x-mongo: &mongo
  image: mongo:7.0
  command: ["bash", "/scripts/rs-entry.sh"]
  restart: unless-stopped
  depends_on:
    keygen:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ready && mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 10s

services:
  # Üyeler arası kimlik doğrulama anahtarı (bir kez üretilir)
  keygen:
    image: mongo:7.0
    entrypoint: ["bash", "-c", "[ -s /keys/mongo-keyfile ] || head -c 756 /dev/urandom | base64 -w0 > /keys/mongo-keyfile; chmod 400 /keys/mongo-keyfile; chown 999:999 /keys/mongo-keyfile"]
    volumes:
      - mongo-keys:/keys

  mongo1:
    <<: *mongo
    hostname: mongo1
    environment:
      RS_NAME: rs0
      RS_INIT: "1"
      RS_MEMBERS: ${RS_MEMBERS:-mongo1:27017}
      CREATE_USERS: "1"
      MONGO_CACHE_GB: ${MONGO_CACHE_GB:-1}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo1-data:/data/db
      - mongo-keys:/keys:ro
      - ./mongo:/scripts:ro

  mongo2:
    <<: *mongo
    hostname: mongo2
    profiles: ["rs3"]
    environment: { RS_NAME: rs0, MONGO_CACHE_GB: "${MONGO_CACHE_GB:-1}" }
    volumes: [mongo2-data:/data/db, mongo-keys:/keys:ro, ./mongo:/scripts:ro]

  mongo3:
    <<: *mongo
    hostname: mongo3
    profiles: ["rs3"]
    environment: { RS_NAME: rs0, MONGO_CACHE_GB: "${MONGO_CACHE_GB:-1}" }
    volumes: [mongo3-data:/data/db, mongo-keys:/keys:ro, ./mongo:/scripts:ro]

  api:
    build:
      context: ..
      target: ${API_BUILD_TARGET:-runtime}
    image: drawguidance-server:33
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
    environment:
      # v40 imajın öntanımlı profili "prod"; yerel geliştirmede öntanımlı profil (üretim: swarm/stack.yml)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@${RS_MEMBERS:-mongo1:27017}/${MONGO_APP_DB}?replicaSet=rs0&authSource=${MONGO_APP_DB}
      MONGO_WRITE_CONCERN: ${MONGO_WRITE_CONCERN:-majority}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-drawguidance}
      # v40 web sitesi (CORS, form sınırı, IP özeti tuzu) ve Slack bildirimleri; değerler .env dosyasından
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-https://drawguidance.ahmetkar.com,http://localhost:3000}
      WEB_ALLOWED_ORIGIN_PATTERNS: ${WEB_ALLOWED_ORIGIN_PATTERNS:-}
      WEB_BEHIND_PROXY: ${WEB_BEHIND_PROXY:-false}
      WEB_PROXY_HOPS: ${WEB_PROXY_HOPS:-1}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "${API_PORT:-4747}:4747"

  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo1:27017/?replicaSet=rs0&authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

volumes:
  mongo-keys:
  mongo1-data:
  mongo2-data:
  mongo3-data:
