# DrawGuidance v40 üretim yığını (Docker Swarm). Kurulum, sırlar ve işletim: README.md (bu klasör).
#   docker stack deploy -c stack.yml --with-registry-auth drawguidance
# Değişkenler (dağıtımı yapan kabukta): REGISTRY (varsayılan ghcr.io/ahmetkar), API_TAG, ACME_EMAIL; isteğe bağlı API_DOMAIN, CONFIG_VERSION.
#
#   İnternet ──80/443──▶ traefik (TLS, HSTS, IP sınırı) ──edge (şifreli overlay)──▶ api ×2 ──backend (şifreli,
#   internal)──▶ mongo1 (kopya kümesi rs0, anahtar dosyası, kimlik doğrulama) ◀── mongo-backup (günlük mongodump)
#   traefik ──socket (şifreli, internal)──▶ socket-proxy (Docker API'sinin yalnız okunan küçük bir parçası)
version: "3.9"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ------------------------------------------------------------------ ters vekil
  traefik:
    image: traefik:v3.7.16
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # Pano ve API kapalı (yönetim yüzeyi yok)
      - --api=false
      - --api.dashboard=false
      - --ping=true
      - --ping.entryPoint=ping
      - --entryPoints.ping.address=:8082
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.permanent=true
      - --entryPoints.web.transport.respondingTimeouts.readTimeout=10s
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls.certResolver=le
      - --entryPoints.websecure.http.middlewares=security-headers@file
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=30s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=120s
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=90s
      # İstemcinin gönderdiği X-Forwarded-* başlıklarına güvenilmez (Traefik kendi değerini yazar)
      - --entryPoints.websecure.forwardedHeaders.insecure=false
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=dg_edge
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL gerekli}
      - --certificatesResolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.le.acme.tlsChallenge=true
      - --accessLog=true
      - --accessLog.format=json
      # Erişim günlüğünde istek başlıkları (Authorization dahil) yok
      - --accessLog.fields.headers.defaultMode=drop
      - --log.level=INFO
    ports:
      # "host" kipi: istemcinin gerçek adresi korunur (ingress yönlendirmesinde kaybolur); Traefik bu düğümde koşar
      - { target: 80, published: 80, protocol: tcp, mode: host }
      - { target: 443, published: 443, protocol: tcp, mode: host }
    networks: [edge, socket]
    volumes:
      - letsencrypt:/letsencrypt
      - { type: tmpfs, target: /tmp, tmpfs: { size: 16777216 } }
    configs:
      - { source: traefik_dynamic, target: /etc/traefik/dynamic.yml, mode: 0444 }
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=ping", "--entryPoints.ping.address=:8082"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.drawguidance.edge == true
      update_config:
        # Kapılar düğümde yayımlandığı için iki görev aynı anda koşamaz
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 64M }

  # Docker soketine doğrudan erişim (Traefik'te) yerine yalnız okunan, süzülmüş API (yazma/POST kapalı)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      SERVICES: "1"
      TASKS: "1"
      NETWORKS: "1"
      NODES: "1"
      VERSION: "1"
      EVENTS: "1"
      PING: "1"
      POST: "0"
      CONTAINERS: "0"
      LOG_LEVEL: warning
      # Overlay ağlar yalnız IPv4; IPv6 dinleyicisi çekirdekte IPv6 yoksa açılışı bozar
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    logging: *logging
    deploy:
      # Tek görev; sanal IP (IPVS) yerine doğrudan görev adresi
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits: { cpus: "0.20", memory: 64M }

  # ------------------------------------------------------------------ uygulama
  api:
    image: ${REGISTRY:-ghcr.io/ahmetkar}/drawguidance-server:${API_TAG:?API_TAG gerekli}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Parola URI'de değil: MONGO_APP_PASSWORD_FILE (Docker sırrı)
      MONGODB_URI: mongodb://mongo1:27017/drawguidance?replicaSet=rs0&authSource=drawguidance
      MONGO_APP_USER: drawguidance
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
      MONGO_WRITE_CONCERN: majority
      FIREBASE_PROJECT_ID: drawguidance
      GOOGLE_PLAY_PACKAGE_NAME: com.karapp.drawguidance
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: /run/secrets/play.json
      # Pub/Sub itme aboneliği OIDC doğrulaması (üretimde zorunlu; gizli değil)
      PUBSUB_PUSH_AUDIENCE: https://drawapi.ahmetkar.com/api/v1/billing/rtdn
      PUBSUB_PUSH_SERVICE_ACCOUNT: drawguidance-backend@drawguidance.iam.gserviceaccount.com
      SLACK_WEBHOOK_URL_FILE: /run/secrets/slack_webhook
      IP_HASH_SALT_FILE: /run/secrets/ip_hash_salt
      WEB_ALLOWED_ORIGINS: https://drawguidance.store
      # X-Forwarded-* yalnız edge ağındaki vekilden (Traefik) okunur
      TRUSTED_PROXIES: '10\.231\.0\.\d{1,3}'
      # v43 içerik dağıtımı: paket resimleri Cloud Storage'da (imzalı adres); cihaz bilgileri şifreli
      GCS_BUCKET: dgpackets
      GCS_SERVICE_ACCOUNT_JSON: /run/secrets/gcs.json
      DEVICE_DATA_KEY_FILE: /run/secrets/device_data_key
      # v44 geçici istisna hesabı (abonelik dışında her şey; sonraki sürümde kaldırılabilir)
      BILLING_EXEMPT_EMAILS: ahmetkar8040@gmail.com
    secrets:
      - { source: mongo_app_password, target: mongo_app_password, uid: "10001", gid: "10001", mode: 0400 }
      - { source: play_service_account, target: play.json, uid: "10001", gid: "10001", mode: 0400 }
      - { source: slack_webhook, target: slack_webhook, uid: "10001", gid: "10001", mode: 0400 }
      - { source: ip_hash_salt, target: ip_hash_salt, uid: "10001", gid: "10001", mode: 0400 }
      - { source: gcs_service_account, target: gcs.json, uid: "10001", gid: "10001", mode: 0400 }
      - { source: device_data_key, target: device_data_key, uid: "10001", gid: "10001", mode: 0400 }
    networks: [edge, backend]
    # Salt okunur kök dosya sistemi; yazılabilir tek yer /tmp (Tomcat geçici dosyaları)
    read_only: true
    volumes:
      - { type: tmpfs, target: /tmp, tmpfs: { size: 67108864 } }
    cap_drop: [ALL]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4747/actuator/health/liveness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging: *logging
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      resources:
        limits: { cpus: "1.00", memory: 1024M }
        reservations: { cpus: "0.25", memory: 512M }
      labels:
        - traefik.enable=true
        # Yalnız /api/** dışarı açık (Actuator dahil başka yol yok)
        - traefik.http.routers.api.rule=Host(`${API_DOMAIN:-drawapi.ahmetkar.com}`) && PathPrefix(`/api/`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls=true
        - traefik.http.routers.api.tls.certresolver=le
        - traefik.http.routers.api.middlewares=api-inflight@file,api-ratelimit@file
        - traefik.http.services.api.loadbalancer.server.port=4747
        - traefik.http.services.api.loadbalancer.healthcheck.path=/actuator/health/liveness
        - traefik.http.services.api.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.api.loadbalancer.healthcheck.timeout=3s

  # ------------------------------------------------------------------ veritabanı
  mongo1:
    image: mongo:7.0
    hostname: mongo1
    command: ["bash", "/scripts/rs-entry.sh"]
    environment:
      RS_NAME: rs0
      RS_INIT: "1"
      RS_MEMBERS: mongo1:27017
      CREATE_USERS: "1"
      MONGO_CACHE_GB: "1"
      MONGO_DROP_ROOT: "1"
      MONGO_KEYFILE: /run/secrets/mongo_keyfile
      MONGO_ROOT_USER: dgadmin
      MONGO_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_DB: drawguidance
      MONGO_APP_USER: drawguidance
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
      MONGO_BACKUP_USER: dgbackup
      MONGO_BACKUP_PASSWORD_FILE: /run/secrets/mongo_backup_password
    secrets:
      - { source: mongo_keyfile, target: mongo_keyfile, uid: "999", gid: "999", mode: 0400 }
      - { source: mongo_root_password, target: mongo_root_password, uid: "0", gid: "0", mode: 0400 }
      - { source: mongo_app_password, target: mongo_app_password, uid: "0", gid: "0", mode: 0400 }
      - { source: mongo_backup_password, target: mongo_backup_password, uid: "0", gid: "0", mode: 0400 }
    configs:
      - { source: mongo_rs_entry, target: /scripts/rs-entry.sh, mode: 0555 }
      - { source: mongo_rs_init, target: /scripts/rs-init.js, mode: 0444 }
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
    networks: [backend]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging
    deploy:
      # Kopya kümesi üyeleri doğrudan görev adresiyle bulunur (sanal IP yok)
      endpoint_mode: dnsrr
      replicas: 1
      placement:
        constraints:
          - node.labels.drawguidance.db == true
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits: { cpus: "2.00", memory: 2048M }
        reservations: { cpus: "0.50", memory: 1024M }

  mongo-backup:
    image: mongo:7.0
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      MONGO_HOSTS: mongo1:27017
      RS_NAME: rs0
      MONGO_BACKUP_USER: dgbackup
      MONGO_BACKUP_PASSWORD_FILE: /run/secrets/mongo_backup_password
      BACKUP_HOUR: "3"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_ON_START: "0"
    secrets:
      - { source: mongo_backup_password, target: mongo_backup_password, mode: 0400 }
    configs:
      - { source: mongo_backup_sh, target: /scripts/backup.sh, mode: 0555 }
    volumes:
      - mongo-backups:/backups
      - { type: tmpfs, target: /tmp, tmpfs: { size: 1048576 } }
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.drawguidance.db == true
      restart_policy:
        condition: any
        delay: 30s
      resources:
        limits: { cpus: "1.00", memory: 512M }

networks:
  # Traefik ↔ api. Alt ağ sabit: api yalnız bu ağdan gelen X-Forwarded-For'a güvenir (TRUSTED_PROXIES)
  edge:
    name: dg_edge
    driver: overlay
    driver_opts:
      encrypted: "true"
    ipam:
      config:
        - subnet: 10.231.0.0/24
  # api ↔ mongo ↔ yedek. internal: dışarıya çıkış yok
  backend:
    name: dg_backend
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"
  # Traefik ↔ socket-proxy
  socket:
    name: dg_socket
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"

volumes:
  letsencrypt:
  mongo1-data:
  mongo1-config:
  mongo-backups:

# Yığından önce oluşturulur (README: "Sırlar"); değerler hiçbir dosyada ya da ortam değişkeninde durmaz
secrets:
  mongo_root_password: { external: true }
  mongo_app_password: { external: true }
  mongo_backup_password: { external: true }
  mongo_keyfile: { external: true }
  play_service_account: { external: true }
  slack_webhook: { external: true }
  ip_hash_salt: { external: true }
  # v43 Cloud Storage hizmet hesabı (dgpackets) ve cihaz bilgisi anahtarı
  gcs_service_account: { external: true }
  device_data_key: { external: true }

# Swarm config'leri değiştirilemez: dosya değişince CONFIG_VERSION artırılır (yeni ad)
configs:
  traefik_dynamic:
    name: dg_traefik_dynamic_${CONFIG_VERSION:-1}
    file: ./traefik-dynamic.yml
  mongo_rs_entry:
    name: dg_mongo_rs_entry_${CONFIG_VERSION:-1}
    file: ../mongo/rs-entry.sh
  mongo_rs_init:
    name: dg_mongo_rs_init_${CONFIG_VERSION:-1}
    file: ../mongo/rs-init.js
  mongo_backup_sh:
    name: dg_mongo_backup_sh_${CONFIG_VERSION:-1}
    file: ./backup.sh
