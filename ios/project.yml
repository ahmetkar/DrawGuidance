name: DrawGuidance
options:
  bundleIdPrefix: com.karapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
packages:
  TalsecRuntime:
    url: https://github.com/talsec/Free-RASP-iOS
    exactVersion: 8.1.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 11.13.0
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 2.7.0
  # Google ve Apple ile giriş (Firebase Authentication; Android ile aynı Firebase projesi)
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 8.0.0
settings:
  base:
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "49"
    SWIFT_VERSION: "5.0"
    # Apple Developer takım kimliği (gizli değil; imzalama ve freeRASP imza denetimi için)
    DEVELOPMENT_TEAM: "G3LKL7QH6D"
    # Google girişinin geri dönüş adresi: GoogleService-Info.plist'teki REVERSED_CLIENT_ID
    # (com.googleusercontent.apps.…). CI bunu plist'ten okuyup verir; boşsa Google düğmesi kapalı kalır.
    DG_GOOGLE_URL_SCHEME: ""
targets:
  DrawGuidance:
    type: application
    platform: iOS
    sources:
      - path: DrawGuidance
      # Çizgi roman hazır resimleri (Android ile ortak; klasör yapısı korunur: comic/chars/...)
      - path: ../android/app/src/main/assets/comic
        type: folder
        buildPhase: resources
      # v46 hazır tuval şablonları (Android ile ortak: templates/catalog.json, templates/<id>/...)
      - path: ../android/app/src/main/assets/templates
        type: folder
        buildPhase: resources
      # Kullanım şartları ve KVKK metni (hesap açılırken onaylanır; Android ile ortak)
      - path: ../android/app/src/main/assets/legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: TalsecRuntime
      - package: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karapp.drawguidance
        PRODUCT_NAME: DrawGuidance
        INFOPLIST_FILE: DrawGuidance/Resources/Info.plist
        # Apple ile giriş yetkisi (App ID'de "Sign in with Apple" açık olmalı)
        CODE_SIGN_ENTITLEMENTS: DrawGuidance/Resources/DrawGuidance.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        # freeRASP: kapatma politikası yalnız App Store imzalı derlemede açılır (bkz. RaspGuard)
        DG_RASP_ENFORCE: "NO"
      configs:
        Release:
          # iOS'ta R8 karşılığı: sembolleri sil, ölü kodu at, dSYM ayrı dursun
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
          DEAD_CODE_STRIPPING: YES
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: NO
  DrawGuidanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrawGuidanceTests
        excludes: ["Fixtures", "Fixtures/**"]
      - path: DrawGuidanceTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: DrawGuidance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DrawGuidanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DrawGuidanceUITests]
    dependencies:
      - target: DrawGuidance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DrawGuidance
schemes:
  DrawGuidance:
    build:
      targets:
        DrawGuidance: all
        DrawGuidanceTests: [test]
        DrawGuidanceUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: DrawGuidance/Resources/DrawGuidance.storekit
    test:
      config: Debug
      targets: [DrawGuidanceTests, DrawGuidanceUITests]
