name: DrawGuidance
options:
  bundleIdPrefix: com.karapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "49"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  DrawGuidance:
    type: application
    platform: iOS
    sources:
      - path: DrawGuidance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karapp.drawguidance
        PRODUCT_NAME: DrawGuidance
        INFOPLIST_FILE: DrawGuidance/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
      configs:
        Release:
          # iOS'ta R8 karşılığı: sembolleri sil, ölü kodu at, dSYM ayrı dursun
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
          DEAD_CODE_STRIPPING: YES
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: NO
  DrawGuidanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrawGuidanceTests
        excludes: ["Fixtures", "Fixtures/**"]
      - path: DrawGuidanceTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: DrawGuidance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DrawGuidanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DrawGuidanceUITests]
    dependencies:
      - target: DrawGuidance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DrawGuidance
schemes:
  DrawGuidance:
    build:
      targets:
        DrawGuidance: all
        DrawGuidanceTests: [test]
        DrawGuidanceUITests: [test]
    test:
      config: Debug
      targets: [DrawGuidanceTests, DrawGuidanceUITests]
